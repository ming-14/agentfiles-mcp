[project]
name = "agentfiles-mcp"
version = "0.1.0"
description = "Local stdio MCP server proxying file tools to agentfiles-server"
requires-python = ">=3.11"
dependencies = [
    "agentfiles-shared",
    # mcp 2.x dropped mcp.server.fastmcp (renamed to MCPServer); the server
    # module is written against the v1 FastMCP API.
    "mcp>=1.2,<2",
    "httpx>=0.27",
]

[project.scripts]
agentfiles-mcp = "agentfiles_mcp.__main__:main"

[tool.uv.sources]
agentfiles-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentfiles_mcp"]
