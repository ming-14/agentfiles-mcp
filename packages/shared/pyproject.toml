[project]
name = "agentfiles-shared"
version = "0.1.0"
description = "Shared schemas, auth signing and error texts for agentfiles-mcp"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentfiles_shared"]
