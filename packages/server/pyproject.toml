[project]
name = "agentfiles-server"
version = "0.1.0"
description = "Remote file tool server (REST/JSON + HMAC signature verification)"
requires-python = ">=3.11"
dependencies = [
    "agentfiles-shared",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[tool.uv.sources]
agentfiles-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentfiles_server"]
